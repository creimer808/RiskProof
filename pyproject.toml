[project]
name = "riskproof"
version = "0.1.0"
description = "Agentic vulnerability investigation and remediation platform for Tenable One and Nessus data."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "RiskProof Contributors" }]
keywords = [
  "vulnerability-management",
  "tenable",
  "nessus",
  "epss",
  "kev",
  "mcp",
  "security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "defusedxml>=0.7",
  "httpx>=0.28",
  # Official MCP Python SDK, 1.x line: `mcp.server.fastmcp.FastMCP`.
  # (SDK 2.x renamed FastMCP -> MCPServer; migrate deliberately, see PLAN.md.)
  "mcp>=1.2,<2",
  "pydantic>=2.12",
  "pydantic-settings>=2.7",
]

[project.scripts]
riskproof = "riskproof.cli:main"

[dependency-groups]
dev = [
  "anyio>=4.4",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["riskproof"]
